services:
  - type: web
    name: party-training-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        fromDatabase:
          name: party-training-db
          property: connectionString

databases:
  - name: party-training-db
    plan: free
    databaseName: party_training
